map $request_method $deephpi_submit_key { POST $binary_remote_addr; default ""; }
map $request_method $deephpi_status_key { GET $binary_remote_addr; default ""; }
limit_req_zone $deephpi_submit_key zone=deephpi_submit:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=deephpi_api:10m rate=10r/m;
limit_req_zone $deephpi_status_key zone=deephpi_status:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=deephpi_conn:10m;

server {
    listen 3220;
    server_name _;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    location = /deepHPI/api/jobs {
        limit_conn deephpi_conn 3;
        limit_req zone=deephpi_submit burst=2 nodelay;
        limit_req zone=deephpi_status burst=10 nodelay;
        proxy_pass http://app:3220;
    }

    location = /deepHPI/api/accession {
        limit_req zone=deephpi_api burst=5 nodelay;
        limit_conn deephpi_conn 5;
        proxy_pass http://app:3220;
    }

    location ~ ^/deepHPI/api/jobs/[A-Za-z0-9_-]+(?:/(?:results|network))?$ {
        limit_req zone=deephpi_status burst=10 nodelay;
        limit_conn deephpi_conn 5;
        proxy_pass http://app:3220;
    }

    location / {
        limit_conn deephpi_conn 20;
        proxy_pass http://app:3220;
    }
}
